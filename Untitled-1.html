<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">
        <h1>🌤️ Weather App</h1>

        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="showWeather()">Search</button>

        <div class="weather-box">
            <h2 id="cityName">Noida</h2>
            <h3 id="temperature">28°C</h3>
            <p id="condition">Sunny</p>

            <div class="details">
                <p>💧 Humidity: <span id="humidity">60%</span></p>
                <p>💨 Wind Speed: <span id="wind">12 km/h</span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
